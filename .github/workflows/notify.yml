name: notify
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  discussion:
    types: [created]
permissions: {}
jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the maintainers' Telegram chat
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIND: ${{ github.event_name }}
          WHO: ${{ github.actor }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title || github.event.discussion.title }}
          URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url || github.event.discussion.html_url }}
        run: |
          curl -sS --fail -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=Mastermind · new ${KIND} by ${WHO}: ${TITLE} ${URL}" \
            --data-urlencode "disable_web_page_preview=true"
