name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write   # the Marketplace sign-in: the Entra app trusts this repo's release environment, no stored token
jobs:
  package:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the app
        run: pwsh -File app/publish.ps1 -Out out/pack/app
      - name: Package both targets
        run: pwsh -File extension/pack.ps1 -SkipPublish
      - name: Attach the packages to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packages = (Get-ChildItem out/*.vsix).FullName
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:GITHUB_REF_NAME $packages --clobber }
          else { gh release create $env:GITHUB_REF_NAME $packages --title $env:GITHUB_REF_NAME --notes-file extension/CHANGELOG.md }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign in to Microsoft Entra
        if: vars.PUBLISH == 'true'
        uses: azure/login@v3
        with:
          client-id: e9dab7d2-d979-4296-b40a-cc745a040ac3
          tenant-id: 28c585e6-6dde-4f4e-aa91-407d3daf64b4
          allow-no-subscriptions: true
      - name: Publish to the Marketplace and Open VSX
        if: vars.PUBLISH == 'true'
        working-directory: extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          $packages = (Get-ChildItem ../out/*.vsix).FullName
          npx vsce publish --packagePath $packages --skip-duplicate --azure-credential
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx ovsx publish --packagePath $packages --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
