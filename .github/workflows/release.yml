name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the app
        run: pwsh -File app/publish.ps1 -Out out/pack/app
      - name: Package both targets
        run: pwsh -File extension/pack.ps1 -SkipPublish
      - name: Attach the packages to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packages = (Get-ChildItem out/*.vsix).FullName
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:GITHUB_REF_NAME $packages --clobber }
          else { gh release create $env:GITHUB_REF_NAME $packages --title $env:GITHUB_REF_NAME --notes-file extension/CHANGELOG.md }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish to the Marketplace and Open VSX
        if: vars.PUBLISH == 'true'
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          $packages = (Get-ChildItem ../out/*.vsix).FullName
          npx vsce publish --packagePath $packages --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx ovsx publish --packagePath $packages --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
